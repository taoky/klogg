name: "Release Linux"

on:
  push:
    tags: ['v[0-9]*']
  # For retries, select the release tag (not master).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          python3 scripts/release.py version

  debian:
    needs: validate
    uses: ./.github/workflows/ci-build.yml

  flatpak:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/klogg-version
      - name: Install Flatpak tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG"
      - name: Build and export Flatpak
        run: |
          flatpak-builder --user --sandbox --jobs=4 --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build dev.filimonov.klogg.release.yaml
          mkdir -p packages-flatpak
          flatpak build-bundle --arch=x86_64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo "packages-flatpak/klogg-$KLOGG_VERSION-x86_64.flatpak" dev.filimonov.klogg
      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: packages-flatpak/*.flatpak
          if-no-files-found: error

  publish:
    needs: [debian, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/klogg-version
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
      - name: Prepare release metadata and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 scripts/release.py prepare --tag "$RELEASE_TAG"
          cp "artifacts/packages-trixie/klogg-$KLOGG_VERSION-trixie.deb" release/
          cp "artifacts/packages-flatpak/klogg-$KLOGG_VERSION-x86_64.flatpak" release/
          xz -d artifacts/packages-trixie/klogg_trixie.debug.xz
          tar -C artifacts/packages-trixie --transform='s/klogg_trixie.debug/klogg.debug/' -cJf "release/klogg-$KLOGG_VERSION-symbols.tar.xz" klogg_trixie.debug
          cd release
          sha256sum --binary ./*.deb ./*.flatpak ./*.tar.xz ./*.json > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
          body: |
            Linux x86_64 builds.

            - The .deb requires Debian 13 and replaces the upstream klogg package.
            - The .flatpak uses dev.filimonov.klogg and downloads its KDE runtime from Flathub if needed. It retains the upstream app ID and sandbox configuration.
            - Flatpak bundles do not configure automatic app updates: install the new bundle for each release.
            - SHA256SUMS and source.json record checksums and the source commit.
